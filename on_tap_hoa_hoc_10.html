const root=document.getElementById('quiz');
function section(t){let h=document.createElement('h2');h.className='section';h.textContent=t;root.append(h)}
section('Phần I · Trắc nghiệm nhiều lựa chọn');
mc.forEach((q,i)=>{let d=document.createElement('article');d.className='q';d.dataset.type='mc';d.dataset.i=i;
d.innerHTML=`<div class="tag">CÂU ${q[0]} · Chọn một đáp án</div><h3>${q[1]}</h3>`+
q[2].map((o,j)=>`<label class="opt"><input type="radio" name="m${i}" value="${j}"><span>${'ABCD'[j]}. ${o}</span></label>`).join('')+
`<div class="result" id="r-m${i}"></div>`;root.append(d)});
section('Phần II · Trắc nghiệm đúng / sai');
tf.forEach((q,i)=>{let d=document.createElement('article');d.className='q';d.dataset.type='tf';d.dataset.i=i;
d.innerHTML=`<div class="tag">CÂU ${q[0]} · Đúng hay sai</div><div class="explain">${q[1]}</div><h3>${q[2]}</h3>
<label class="opt"><input type="radio" name="t${i}" value="true"><span>Đúng</span></label>
<label class="opt"><input type="radio" name="t${i}" value="false"><span>Sai</span></label><div class="result" id="r-t${i}"></div>`;root.append(d)});
section('Phần III · Trả lời ngắn');
shortq.forEach((q,i)=>{let d=document.createElement('article');d.className='q';d.dataset.type='short';d.dataset.i=i;
d.innerHTML=`<div class="tag">CÂU ${q[0]}</div><h3>${q[1]}</h3><input aria-label="Đáp án" id="s${i}" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit" placeholder="Nhập đáp án..."><div class="result" id="r-s${i}"></div>`;root.append(d)});
function norm(s){return s.toLowerCase().replace(/\s/g,'').replace(',','.').replace('％','%')}
function grade(){let score=0,total=mc.length+tf.length+shortq.length;
mc.forEach((q,i)=>{let v=document.querySelector(`input[name=m${i}]:checked`);let ok=!!v&&+v.value===q[3];if(ok)score++;let r=document.getElementById('r-m'+i);r.className='result '+(ok?'good':'bad');r.innerHTML=(ok?'Chính xác!':'Chưa đúng. Đáp án: '+ 'ABCD'[q[3]]+'. '+q[2][q[3]])});
tf.forEach((q,i)=>{let v=document.querySelector(`input[name=t${i}]:checked`);let ok=!!v&&(v.value==='true')===q[3];if(ok)score++;let r=document.getElementById('r-t'+i);r.className='result '+(ok?'good':'bad');r.textContent=(ok?'Chính xác!':'Đáp án đúng: '+(q[3]?'Đúng':'Sai'))});
shortq.forEach((q,i)=>{let v=document.getElementById('s'+i).value.trim();let ok=norm(v)===norm(q[2]);if(ok)score++;let r=document.getElementById('r-s'+i);r.className='result '+(ok?'good':'bad');r.innerHTML=(ok?'Chính xác!':'Đáp án tham khảo: '+q[2])+`<div class="explain">${q[3]}</div>`});
document.getElementById('stats').textContent=`Kết quả: ${score}/${total} câu đúng (${(score/total*10).toFixed(2)}/10). Đáp án và lời giải đã hiện bên dưới.`;window.scrollTo({top:0,behavior:'smooth'})}
function showAll(){mc.forEach((q,i)=>{let r=document.getElementById('r-m'+i);r.className='result good';r.textContent='Đáp án: '+ 'ABCD'[q[3]]+'. '+q[2][q[3]]});tf.forEach((q,i)=>{let r=document.getElementById('r-t'+i);r.className='result good';r.textContent='Đáp án: '+(q[3]?'Đúng':'Sai')});shortq.forEach((q,i)=>{let r=document.getElementById('r-s'+i);r.className='result good';r.innerHTML='Đáp án tham khảo: '+q[2]+`<div class="explain">${q[3]}</div>`});document.getElementById('stats').textContent='Đã hiện toàn bộ đáp án tham khảo.'}
function resetQuiz(){document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);document.querySelectorAll('input[id^=s]').forEach(x=>x.value='');document.querySelectorAll('.result').forEach(x=>{x.className='result';x.textContent=''});document.getElementById('stats').textContent='Đã xóa câu trả lời. Hãy bắt đầu lại.';window.scrollTo({top:0,behavior:'smooth'})}
</script>
